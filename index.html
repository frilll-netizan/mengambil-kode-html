<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🔒 SYSTEM LOCKED 🔒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        body {
            background: #000;
            color: #f00;
            font-family: 'Courier New', monospace;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        
        .container {
            background: #0a0000;
            border: 3px solid #f00;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px #f00;
        }
        
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #f00;
            text-shadow: 0 0 10px #f00;
        }
        
        .subheader {
            font-size: 12px;
            color: #f66;
            margin-bottom: 20px;
            border-bottom: 1px solid #f00;
            padding-bottom: 10px;
        }
        
        .pin-display {
            background: #1a0000;
            border: 2px solid #f00;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            font-size: 48px;
            letter-spacing: 15px;
            font-weight: bold;
            color: #f00;
            text-shadow: 0 0 10px #f00;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .key {
            background: #2a0000;
            border: 2px solid #f00;
            border-radius: 10px;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #f00;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 0 15px rgba(255,0,0,0.3);
            text-shadow: 0 0 5px #f00;
        }
        
        .key:active {
            background: #f00;
            color: #000;
            transform: scale(0.95);
        }
        
        .enter-btn {
            background: #f00;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #000;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px #f00;
        }
        
        .enter-btn:active {
            background: #900;
            transform: scale(0.98);
        }
        
        .timer {
            font-size: 28px;
            color: #ff0;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .warning {
            font-size: 14px;
            color: #f00;
            margin: 10px 0;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .status {
            font-size: 12px;
            color: #f66;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f00;
            text-align: left;
        }
        
        /* Fullscreen fix */
        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">⚠️ TERKUNCI ⚠️</div>
        <div class="subheader">MASUKKAN PIN UNTUK KELUAR</div>
        
        <div class="pin-display" id="pinDisplay">_ _ _</div>
        
        <div class="keypad" id="keypad"></div>
        
        <button class="enter-btn" onclick="checkPin()" id="enterBtn">ENTER</button>
        
        <div class="timer" id="timer">04:34</div>
        <div class="warning">PIN: 100</div>
        
        <div class="status">
            <div id="statusMsg">>> STATUS: LOCKED</div>
        </div>
    </div>

    <script>
        // ===========================================
        // MOBILE LOCKDOWN - BENERAN GAK BISA KELUAR
        // ===========================================
        
        let enteredPin = "";
        const correctPin = "100";
        let attempts = 0;
        let timeLeft = 274; // 04:34 = 274 detik
        
        // ===== 1. BLOCK SEMUA TOMBOL HP =====
        
        // Block tombol back Android
        history.pushState(null, null, location.href);
        window.onpopstate = function(event) {
            history.pushState(null, null, location.href);
            showStatus("❌ TOMBOL BACK DIBLOCK!");
            timeLeft -= 5;
            return false;
        };
        
        // Block semua tombol fisik
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            
            // Block volume, power, back, dll
            const blockedKeys = [
                'Backspace', 'Escape', 'F11', 'F12',
                'VolumeUp', 'VolumeDown', 'Power', 'Home'
            ];
            
            if (blockedKeys.includes(e.key)) {
                showStatus("❌ TOMBOL FISIK DIBLOCK!");
                return false;
            }
            
            // Handle input angka
            if (e.key >= '0' && e.key <= '9') {
                addPin(e.key);
            }
            
            // Enter
            if (e.key === 'Enter') {
                checkPin();
            }
            
            return false;
        });
        
        // ===== 2. BLOCK SEMUA GESTURE HP =====
        
        // Block swipe back
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchend', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // Block gesture dari tepi layar
        document.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            if (touch.clientX < 50 || touch.clientX > window.innerWidth - 50) {
                // Swipe dari tepi
                showStatus("❌ GESTURE TEPI DIBLOCK!");
                e.preventDefault();
                timeLeft -= 2;
            }
        }, { passive: false });
        
        // ===== 3. BLOCK SEMUA NAVIGASI =====
        
        // Block menu recent apps (via gesture)
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length >= 3) {
                // 3 jari = recent apps
                showStatus("❌ RECENT APPS DIBLOCK!");
                e.preventDefault();
                timeLeft -= 10;
            }
        });
        
        // Block home button (via gesture)
        let touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchmove', function(e) {
            const touch = e.touches[0];
            if (touch.clientY - touchStartY > 100) {
                // Swipe up dari bawah = home
                showStatus("❌ HOME GESTURE DIBLOCK!");
                e.preventDefault();
                timeLeft -= 5;
            }
        });
        
        // ===== 4. PAKSA FULLSCREEN DI HP =====
        
        function forceFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    // Coba lagi
                    setTimeout(forceFullscreen, 100);
                });
            }
        }
        
        // Paksa fullscreen terus
        forceFullscreen();
        setInterval(forceFullscreen, 500);
        
        // Orientasi paksa landscape/portrait
        screen.orientation.lock('portrait').catch(() => {});
        
        // ===== 5. CEK KELUAR DARI APP =====
        
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // Balik lagi
                window.focus();
                forceFullscreen();
                timeLeft -= 30; // Hukuman
                showStatus("❌ KELUAR APP? HUKUMAN -30 DETIK!");
            }
        });
        
        window.addEventListener('blur', function() {
            setTimeout(() => {
                window.focus();
            }, 10);
        });
        
        // ===== 6. BLOCK SCREENSHOT =====
        
        // Visual feedback kalo screenshot
        document.addEventListener('keyup', function(e) {
            if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 's')) {
                showStatus("❌ SCREENSHOT DIBLOCK!");
                timeLeft -= 5;
            }
        });
        
        // ===== 7. FUNGSI PIN =====
        
        function createKeypad() {
            const keypad = document.getElementById('keypad');
            const keys = [
                '1', '2', '3',
                '4', '5', '6',
                '7', '8', '9',
                'C', '0', 'X'
            ];
            
            keys.forEach(key => {
                const btn = document.createElement('div');
                btn.className = 'key';
                btn.textContent = key;
                
                btn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (key === 'C') clearPin();
                    else if (key === 'X') deletePin();
                    else addPin(key);
                };
                
                keypad.appendChild(btn);
            });
        }
        
        function addPin(num) {
            if (enteredPin.length < 3) {
                enteredPin += num;
                updateDisplay();
            }
        }
        
        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updateDisplay();
        }
        
        function clearPin() {
            enteredPin = "";
            updateDisplay();
        }
        
        function updateDisplay() {
            let display = "";
            for (let i = 0; i < 3; i++) {
                if (i < enteredPin.length) display += enteredPin[i] + " ";
                else display += "_ ";
            }
            document.getElementById('pinDisplay').innerText = display;
        }
        
        function checkPin() {
            if (enteredPin === correctPin) {
                // PIN BENAR
                document.body.innerHTML = `
                    <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#0f0; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                        <div>✅ PIN BENAR</div>
                        <div style="font-size:16px; margin-top:20px;">MEMBUKA KUNCI...</div>
                    </div>
                `;
                
                setTimeout(() => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                }, 2000);
            } else {
                attempts++;
                showStatus(`❌ PIN SALAH! PERCOBAAN ${attempts}/5`);
                
                if (attempts >= 5) {
                    // MAX ATTEMPT
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#f00; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                            <div>💀💀💀</div>
                            <div>PERCOBAAN GAGAL</div>
                            <div style="font-size:16px; margin-top:20px;">DATA DIENKRIPSI</div>
                        </div>
                    `;
                } else {
                    enteredPin = "";
                    updateDisplay();
                    timeLeft = Math.max(0, timeLeft - 15);
                }
            }
        }
        
        function showStatus(msg) {
            document.getElementById('statusMsg').innerHTML = `>> ${msg}`;
            
            // Getar dikit (simulasi)
            document.body.style.transform = 'translateX(5px)';
            setTimeout(() => {
                document.body.style.transform = 'translateX(-5px)';
            }, 50);
            setTimeout(() => {
                document.body.style.transform = 'translateX(0)';
            }, 100);
        }
        
        function startTimer() {
            const timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#f00; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                            <div>⏰ WAKTU HABIS</div>
                            <div style="font-size:16px; margin-top:20px;">ENKRIPSI OTOMATIS...</div>
                        </div>
                    `;
                    clearInterval(timerInterval);
                }
                
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = 
                    `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            }, 1000);
        }
        
        // INIT
        window.onload = function() {
            createKeypad();
            startTimer();
            updateDisplay();
            
            // Push state buat block back
            history.pushState(null, null, location.href);
            
            showStatus(">> GA BISA KELUAR!");
        };
    </script>
</body>
</html>
