<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🔒 DEATH LOCK 🔒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            color: #f00;
            font-family: 'Courier New', monospace;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        
        .container {
            background: #0a0000;
            border: 3px solid #f00;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 100px #f00;
            position: relative;
            z-index: 9999;
        }
        
        .glitch {
            font-size: 32px;
            font-weight: bold;
            animation: glitch 0.3s infinite;
            margin-bottom: 10px;
        }
        
        @keyframes glitch {
            0% { text-shadow: 2px 2px #f00, -2px -2px #00f; }
            25% { text-shadow: -2px 2px #f00, 2px -2px #00f; }
            50% { text-shadow: 2px -2px #f00, -2px 2px #00f; }
            75% { text-shadow: -2px -2px #f00, 2px 2px #00f; }
            100% { text-shadow: 2px 2px #f00, -2px -2px #00f; }
        }
        
        .sub {
            font-size: 14px;
            color: #f66;
            margin-bottom: 20px;
            border-bottom: 1px solid #f00;
            padding-bottom: 10px;
        }
        
        .pin-display {
            background: #1a0000;
            border: 2px solid #f00;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            font-size: 56px;
            letter-spacing: 15px;
            font-weight: bold;
            color: #f00;
            text-shadow: 0 0 20px #f00;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .key {
            background: #2a0000;
            border: 2px solid #f00;
            border-radius: 10px;
            padding: 20px;
            font-size: 36px;
            font-weight: bold;
            color: #f00;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        
        .key:active {
            background: #f00;
            color: #000;
            transform: scale(0.9);
        }
        
        .enter-btn {
            background: #f00;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #000;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 0 50px #f00;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .timer {
            font-size: 36px;
            color: #ff0;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .warning {
            font-size: 16px;
            color: #f00;
            animation: blink 0.5s infinite;
        }
        
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        .counter {
            font-size: 14px;
            color: #f66;
            margin-top: 10px;
        }
        
        /* Overlay buat block touch */
        .touch-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 9998;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glitch">💀 DEATH LOCK 💀</div>
        <div class="sub">GA BISA KELUAR SAMPE KAPAN PUN</div>
        
        <div class="pin-display" id="pinDisplay">_ _ _</div>
        
        <div class="keypad" id="keypad"></div>
        
        <button class="enter-btn" onclick="checkPin()">ENTER</button>
        
        <div class="timer" id="timer">04:34</div>
        <div class="warning">⚠️ PIN: 100 ⚠️</div>
        <div class="counter" id="counter">BACK PRESS: 0</div>
    </div>
    
    <div class="touch-blocker" id="touchBlocker"></div>

    <script>
        // ===========================================
        // INFINITE LOCK - GAK BISA KELUAR SAMPE KAPAN PUN
        // ===========================================
        
        let enteredPin = "";
        const correctPin = "100";
        let attempts = 0;
        let timeLeft = 274;
        let backCount = 0;
        let isLocked = true;
        
        // ===== 1. INFINITE HISTORY LOOP =====
        // Ini yg bikin back button GAK PERNAH BISA KELUAR
        
        function setupInfiniteHistory() {
            // Push state pertama
            history.pushState(null, null, location.href);
            
            // Setiap kali back dipencet, kita push state baru
            window.addEventListener('popstate', function(event) {
                if (isLocked) {
                    backCount++;
                    document.getElementById('counter').innerText = `BACK PRESS: ${backCount}`;
                    
                    // Push 3 state sekaligus biar makin dalem
                    history.pushState(null, null, location.href);
                    history.pushState(null, null, location.href);
                    history.pushState(null, null, location.href);
                    
                    // Hukuman makin berat
                    timeLeft = Math.max(0, timeLeft - 5);
                    
                    // Efek visual
                    document.body.style.backgroundColor = '#f00';
                    setTimeout(() => {
                        document.body.style.backgroundColor = '#000';
                    }, 100);
                    
                    // Kalo kebanyakan back, tambah hukuman
                    if (backCount % 10 === 0) {
                        timeLeft -= 30;
                        alert(`⚠️ UDAH ${backCount} KALI BACK! MAU KELUAR? GA BISA!`);
                    }
                    
                    // Kalo back > 50, aktifin mode gila
                    if (backCount > 50) {
                        document.querySelector('.container').style.transform = 'rotate(180deg)';
                    }
                    
                    // Kalo back > 100, reset counter tapi tetep gak bisa keluar
                    if (backCount > 100) {
                        backCount = 0;
                        alert('💀 100 KALI BACK? LO KERAS KEPALA! TAPI TETEP GA BISA KELUAR 💀');
                    }
                }
            });
        }
        
        // ===== 2. BLOCK SEMUA TOMBOL FISIK =====
        
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Block semua key
            const key = e.key;
            
            // Volume up/down
            if (key.includes('Volume')) {
                timeLeft -= 2;
                showFeedback('🔇 VOLUME DIBLOCK!');
            }
            
            // Power (deteksi via screen off)
            if (key === 'Power' || key === 'PowerOff') {
                timeLeft -= 10;
                showFeedback('⚡ POWER DIBLOCK!');
            }
            
            // Input angka
            if (key >= '0' && key <= '9') {
                addPin(key);
            }
            
            // Enter
            if (key === 'Enter') {
                checkPin();
            }
            
            // Backspace
            if (key === 'Backspace' || key === 'Delete') {
                deletePin();
            }
            
            return false;
        });
        
        // ===== 3. BLOCK SEMUA GESTURE =====
        
        let touchStartX, touchStartY, touchStartTime;
        
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchStartTime = Date.now();
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            // Deteksi gesture
            if (Math.abs(deltaX) > 50) {
                // Swipe kiri/kanan
                showFeedback('⬅️ SWIPE DIBLOCK!');
                timeLeft -= 2;
                
                // Balikin posisi
                document.body.style.transform = 'translateX(0)';
            }
            
            if (deltaY < -50) {
                // Swipe up (recent apps)
                showFeedback('⬆️ RECENT APPS DIBLOCK!');
                timeLeft -= 5;
                
                // Paksa balik
                window.focus();
            }
            
            if (deltaY > 50 && touch.clientY < 100) {
                // Swipe down dari atas (notifikasi)
                showFeedback('⬇️ NOTIFIKASI DIBLOCK!');
                timeLeft -= 3;
            }
            
            if (deltaY > 100 && touch.clientY > window.innerHeight - 100) {
                // Swipe up dari bawah (home)
                showFeedback('🏠 HOME GESTURE DIBLOCK!');
                timeLeft -= 10;
                
                // Paksa fullscreen
                forceFullscreen();
            }
            
        }, { passive: false });
        
        document.addEventListener('touchend', function(e) {
            e.preventDefault();
            
            const touchDuration = Date.now() - touchStartTime;
            
            // Deteksi long press
            if (touchDuration > 1000) {
                showFeedback('⏱️ LONG PRESS DIBLOCK!');
                timeLeft -= 3;
            }
            
        }, { passive: false });
        
        // ===== 4. BLOCK 3 JARI (RECENT APPS) =====
        
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length >= 3) {
                showFeedback('👆 3 JARI! RECENT APPS DIBLOCK!');
                timeLeft -= 15;
                e.preventDefault();
                
                // Getar visual
                document.body.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    document.body.style.transform = 'scale(1)';
                }, 200);
            }
        });
        
        // ===== 5. PAKSA FULLSCREEN =====
        
        function forceFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
        
        setInterval(forceFullscreen, 200);
        forceFullscreen();
        
        // ===== 6. DETEKSI KELUAR APP =====
        
        let hiddenCount = 0;
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                hiddenCount++;
                showFeedback(`🚫 KELUAR APP PERCOBAAN ${hiddenCount}`);
                
                // Hukuman berat
                timeLeft -= 30;
                
                // Kalo kebanyakan keluar, reset timer ke awal
                if (hiddenCount % 3 === 0) {
                    timeLeft = 274;
                    showFeedback('⚠️ TIMER DI-RESET! MULAI LAGI!');
                }
                
                // Paksa balik
                window.focus();
                forceFullscreen();
            }
        });
        
        // ===== 7. BLOCK SCREENSHOT =====
        
        document.addEventListener('keyup', function(e) {
            if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 's')) {
                showFeedback('📸 SCREENSHOT DIBLOCK!');
                timeLeft -= 10;
                
                // Flash putih
                document.body.style.backgroundColor = '#fff';
                setTimeout(() => {
                    document.body.style.backgroundColor = '#000';
                }, 100);
            }
        });
        
        // ===== 8. FUNGSI PIN =====
        
        function createKeypad() {
            const keypad = document.getElementById('keypad');
            const keys = ['1','2','3','4','5','6','7','8','9','C','0','X'];
            
            keys.forEach(key => {
                const btn = document.createElement('div');
                btn.className = 'key';
                btn.textContent = key;
                
                btn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (key === 'C') clearPin();
                    else if (key === 'X') deletePin();
                    else addPin(key);
                };
                
                keypad.appendChild(btn);
            });
        }
        
        function addPin(num) {
            if (enteredPin.length < 3) {
                enteredPin += num;
                updateDisplay();
            }
        }
        
        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updateDisplay();
        }
        
        function clearPin() {
            enteredPin = "";
            updateDisplay();
        }
        
        function updateDisplay() {
            let display = "";
            for (let i = 0; i < 3; i++) {
                if (i < enteredPin.length) display += enteredPin[i] + " ";
                else display += "_ ";
            }
            document.getElementById('pinDisplay').innerText = display;
        }
        
        function checkPin() {
            if (enteredPin === correctPin) {
                // PIN BENAR
                isLocked = false;
                document.body.innerHTML = `
                    <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#0f0; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                        <div>✅ PIN BENAR</div>
                        <div style="font-size:16px; margin-top:20px;">MEMBUKA KUNCI...</div>
                    </div>
                `;
                
                setTimeout(() => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    window.close();
                }, 2000);
            } else {
                attempts++;
                showFeedback(`❌ PIN SALAH! PERCOBAAN ${attempts}/5`);
                
                if (attempts >= 5) {
                    // MAX ATTEMPT - MODE GILA
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#f00; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column; animation:glitch 0.1s infinite;">
                            <div>💀💀💀💀💀</div>
                            <div style="font-size:24px; margin:20px;">5x SALAH!</div>
                            <div style="font-size:16px;">LOCK PERMANEN</div>
                            <div style="font-size:12px; margin-top:50px;">GAK BISA KELUAR LAGI</div>
                        </div>
                    `;
                } else {
                    enteredPin = "";
                    updateDisplay();
                    timeLeft = Math.max(0, timeLeft - 30);
                }
            }
        }
        
        function showFeedback(msg) {
            const counter = document.getElementById('counter');
            counter.innerHTML = `BACK PRESS: ${backCount} | ${msg}`;
            
            // Efek getar
            document.body.style.transform = 'translateX(10px)';
            setTimeout(() => {
                document.body.style.transform = 'translateX(-10px)';
            }, 50);
            setTimeout(() => {
                document.body.style.transform = 'translateX(5px)';
            }, 100);
            setTimeout(() => {
                document.body.style.transform = 'translateX(0)';
            }, 150);
        }
        
        function startTimer() {
            setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    
                    const mins = Math.floor(timeLeft / 60);
                    const secs = timeLeft % 60;
                    document.getElementById('timer').innerText = 
                        `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                } else {
                    // Timer habis tapi tetep gak bisa keluar
                    document.getElementById('timer').style.color = '#f00';
                    document.getElementById('timer').innerText = '00:00';
                }
            }, 1000);
        }
        
        // ===== 9. TAMBAHAN: BLOCK ASSISTIVE TOUCH =====
        
        // Block gesture assistive touch (lingkaran mengambang)
        document.addEventListener('touchstart', function(e) {
            // Deteksi sentuhan di area yang mencurigakan
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                if (touch.radiusX > 50 || touch.radiusY > 50) {
                    // Mungkin assistive touch
                    showFeedback('🔄 ASSISTIVE TOUCH DIBLOCK!');
                    timeLeft -= 20;
                    e.preventDefault();
                }
            }
        });
        
        // INIT
        window.onload = function() {
            createKeypad();
            setupInfiniteHistory();
            startTimer();
            updateDisplay();
            forceFullscreen();
            
            // Push state awal
            for (let i = 0; i < 10; i++) {
                history.pushState(null, null, location.href);
            }
            
            showFeedback('GA BISA KELUAR!');
        };
    </script>
</body>
</html>
