<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 SYSTEM LOCKED 🔒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #000000, #1a0000);
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            color: #ff0000;
            position: fixed;
            width: 100%;
        }
        
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 500px;
            z-index: 9999;
        }
        
        .warning-icon {
            font-size: 80px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .subtitle {
            font-size: 14px;
            margin-bottom: 30px;
            color: #ff6666;
        }
        
        .pin-display {
            font-size: 48px;
            font-weight: bold;
            background: rgba(255,0,0,0.1);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff0000;
            margin-bottom: 20px;
            letter-spacing: 10px;
            text-shadow: 0 0 15px red;
        }
        
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .pin-btn {
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff0000;
            color: white;
            font-size: 28px;
            padding: 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.2s;
        }
        
        .pin-btn:hover {
            background: rgba(255,0,0,0.5);
            transform: scale(1.05);
        }
        
        .pin-btn:active {
            transform: scale(0.95);
        }
        
        .enter-btn {
            background: #ff0000;
            color: black;
            font-size: 24px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .enter-btn:hover {
            background: #cc0000;
        }
        
        .timer {
            font-size: 24px;
            margin: 20px 0;
            color: #ff9900;
        }
        
        .threat-text {
            font-size: 12px;
            color: #666;
            margin-top: 30px;
            line-height: 1.5;
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9998;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="warning-icon">⚠️</div>
        <h1>SYSTEM TERKUNCI</h1>
        <div class="subtitle">SEMUA FILE ANDA TELAH DIENKRIPSI</div>
        
        <div class="pin-display" id="pinDisplay">____</div>
        
        <div class="pin-pad">
            <div class="pin-btn" onclick="addPin(1)">1</div>
            <div class="pin-btn" onclick="addPin(2)">2</div>
            <div class="pin-btn" onclick="addPin(3)">3</div>
            <div class="pin-btn" onclick="addPin(4)">4</div>
            <div class="pin-btn" onclick="addPin(5)">5</div>
            <div class="pin-btn" onclick="addPin(6)">6</div>
            <div class="pin-btn" onclick="addPin(7)">7</div>
            <div class="pin-btn" onclick="addPin(8)">8</div>
            <div class="pin-btn" onclick="addPin(9)">9</div>
            <div class="pin-btn" onclick="addPin(0)">0</div>
            <div class="pin-btn" onclick="clearPin()">C</div>
            <div class="pin-btn" onclick="deletePin()">⌫</div>
        </div>
        
        <button class="enter-btn" onclick="checkPin()">ENTER</button>
        
        <div class="timer" id="timer">⏳ 05:00</div>
        
        <div class="threat-text">
            PERINGATAN!<br>
            Masukkan PIN dengan benar dalam waktu 5 menit.<br>
            Jika gagal, semua data akan dihapus permanen.<br>
            Jangan tutup jendela ini atau data akan rusak.<br>
            PIN: 100
        </div>
    </div>

    <script>
        // VARIABEL GLOBAL
        let enteredPin = "";
        const correctPin = "100";
        let timeLeft = 300; // 5 menit dalam detik
        let timerInterval;
        let attempts = 0;
        const maxAttempts = 3;
        
        // CEK BROWSER
        if (window.innerWidth > 0) {
            // PAKSA FULLSCREEN TERUS
            function goFullScreen() {
                let doc = document.documentElement;
                if (doc.requestFullscreen) {
                    doc.requestFullscreen();
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen();
                } else if (doc.msRequestFullscreen) {
                    doc.msRequestFullscreen();
                }
            }
            
            // PANGGIL FULLSCREEN TERUS
            goFullScreen();
            setInterval(goFullScreen, 1000);
        }
        
        // DISABLE SEMUA TOMBOL KELUAR
        document.addEventListener('keydown', function(e) {
            // CEK TOMBOL BAHAYA
            if (e.key === 'Escape' || 
                e.key === 'F11' ||
                (e.altKey && e.key === 'F4') ||
                (e.ctrlKey && e.key === 'w') ||
                (e.ctrlKey && e.key === 'q') ||
                (e.ctrlKey && e.shiftKey && e.key === 'q') ||
                (e.key === 'F5') ||
                (e.ctrlKey && e.key === 'r') ||
                (e.ctrlKey && e.shiftKey && e.key === 'r') ||
                (e.key === 'F12') ||
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.shiftKey && e.key === 'J') ||
                (e.ctrlKey && e.key === 'u')) {
                
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            
            // TANGKAP INPUT ANGKA
            if (!isNaN(parseInt(e.key)) && e.key >= '0' && e.key <= '9') {
                addPin(parseInt(e.key));
            }
            
            // ENTER KEY
            if (e.key === 'Enter') {
                checkPin();
            }
            
            // BACKSPACE
            if (e.key === 'Backspace') {
                deletePin();
            }
        });
        
        // DISABLE KLIK KANAN
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // DISABLE SELECT
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
        });
        
        // CEK SETIAP KALI USER COBA KELUAR
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        });
        
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
                goFullScreen();
            }, 100);
        });
        
        // FUNGSI PIN
        function addPin(num) {
            if (enteredPin.length < 3) {
                enteredPin += num.toString();
                updateDisplay();
            }
        }
        
        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updateDisplay();
        }
        
        function clearPin() {
            enteredPin = "";
            updateDisplay();
        }
        
        function updateDisplay() {
            let display = "";
            for (let i = 0; i < 3; i++) {
                if (i < enteredPin.length) {
                    display += enteredPin[i] + " ";
                } else {
                    display += "_ ";
                }
            }
            document.getElementById('pinDisplay').innerText = display.trim();
        }
        
        function checkPin() {
            if (enteredPin === correctPin) {
                // PIN BENAR - TAMPILIN PESAN
                document.body.innerHTML = `
                    <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#0f0; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999;">
                        ✅ AKSES DITERIMA - FILE ANDA AMAN ✅
                    </div>
                `;
                clearInterval(timerInterval);
            } else {
                // PIN SALAH
                attempts++;
                
                if (attempts >= maxAttempts) {
                    // MAKSIMAL PERCOBAAN - SIMULASI HAPUS FILE
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#f00; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                            <div>💀 SEMUA FILE DIHAPUS 💀</div>
                            <div style="font-size:16px; margin-top:20px;">C://Windows/System32/data.bin - DELETED</div>
                            <div style="font-size:16px;">D://Documents/private.key - DELETED</div>
                            <div style="font-size:16px;">E://Backup/archive.zip - CORRUPTED</div>
                        </div>
                    `;
                    clearInterval(timerInterval);
                } else {
                    // RESET PIN
                    alert("PIN SALAH! Sisa percobaan: " + (maxAttempts - attempts));
                    enteredPin = "";
                    updateDisplay();
                    
                    // KURANGI WAKTU
                    timeLeft = Math.max(0, timeLeft - 30);
                }
            }
        }
        
        // TIMER COUNTDOWN
        function startTimer() {
            timerInterval = setInterval(function() {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    // WAKTU HABIS - HAPUS SEMUA (SIMULASI)
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#f00; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                            <div>⏰ WAKTU HABIS ⏰</div>
                            <div style="font-size:20px; margin-top:20px;">SISTEM MELAKUKAN FORMAT OTOMATIS...</div>
                            <div style="font-size:14px; margin-top:30px;">[====================] 100%</div>
                            <div style="font-size:14px; color:#f66;">SEMUA DATA TELAH DIHAPUS</div>
                        </div>
                    `;
                    clearInterval(timerInterval);
                    return;
                }
                
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timer').innerText = `⏳ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        startTimer();
        
        // PAKSA FOKUS TERUS
        window.focus();
        setInterval(function() {
            window.focus();
        }, 100);
        
        // DISABLE SCROLL
        window.addEventListener('scroll', function(e) {
            window.scrollTo(0, 0);
            e.preventDefault();
        });
        
        // LOCK TOUCH MOVE
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // SENSOR API - DETEKSI KELUAR DARI TAB
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // KALO PINDAH TAB, KEMBALIKAN
                setTimeout(function() {
                    window.focus();
                    goFullScreen();
                    
                    // TAMBAH EFEK PANIK
                    timeLeft = Math.max(0, timeLeft - 10);
                }, 10);
            }
        });
    </script>
</body>
</html>
