<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🔒 ABSOLUTE LOCK 🔒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* LAYER 1 - Fullscreen paksa */
        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            pointer-events: none; /* Semua element awalnya gak bisa diklik */
        }
        
        /* LAYER 2 - Container utama (ini yg bisa diklik) */
        .clickable-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            z-index: 10000;
            pointer-events: auto; /* Hanya area ini yg bisa diklik */
            background: #0a0000;
            border: 3px solid #f00;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 100px #f00;
        }
        
        /* LAYER 3 - Overlay blocker (nutup semua area yg gak boleh diklik) */
        .blocker-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 9999;
            pointer-events: auto; /* Blocker nangkep semua klik di luar container */
        }
        
        /* LAYER 4 - System UI blocker (nutup navigation bar) */
        .system-blocker {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px; /* Nutup area navigation bar */
            background: #000;
            z-index: 20000;
            pointer-events: auto;
            opacity: 0.95;
            border-top: 2px solid #f00;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f00;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        /* LAYER 5 - Top blocker (nutup status bar) */
        .top-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px; /* Nutup area status bar */
            background: #000;
            z-index: 20000;
            pointer-events: auto;
            opacity: 0.95;
            border-bottom: 2px solid #f00;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f00;
            font-size: 12px;
        }
        
        /* Style untuk container */
        .glitch {
            font-size: 36px;
            font-weight: bold;
            animation: glitch 0.2s infinite;
            color: #f00;
            margin-bottom: 10px;
        }
        
        @keyframes glitch {
            0% { text-shadow: 3px 3px #f00, -3px -3px #00f; }
            25% { text-shadow: -3px 3px #f00, 3px -3px #00f; }
            50% { text-shadow: 3px -3px #f00, -3px 3px #00f; }
            75% { text-shadow: -3px -3px #f00, 3px 3px #00f; }
            100% { text-shadow: 3px 3px #f00, -3px -3px #00f; }
        }
        
        .pin-display {
            background: #1a0000;
            border: 2px solid #f00;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-size: 64px;
            letter-spacing: 15px;
            font-weight: bold;
            color: #f00;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .key {
            background: #2a0000;
            border: 2px solid #f00;
            border-radius: 10px;
            padding: 20px;
            font-size: 40px;
            font-weight: bold;
            color: #f00;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        
        .key:active {
            background: #f00;
            color: #000;
            transform: scale(0.95);
        }
        
        .enter-btn {
            background: #f00;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 36px;
            font-weight: bold;
            color: #000;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 0 50px #f00;
        }
        
        .timer {
            font-size: 40px;
            color: #ff0;
            margin: 15px 0;
        }
        
        .warning {
            color: #f00;
            font-size: 18px;
            animation: blink 0.5s infinite;
        }
        
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <!-- LAYER 1: System UI Blocker (nutup navigation bar) -->
    <div class="system-blocker" id="systemBlocker">
        🔒 NAVIGASI DIBLOCK - MASUKKAN PIN 🔒
    </div>
    
    <!-- LAYER 2: Top Blocker (nutup status bar) -->
    <div class="top-blocker" id="topBlocker">
        🔒 STATUS BAR DIBLOCK - PIN: 100 🔒
    </div>
    
    <!-- LAYER 3: Blocker utama (nangkep semua klik di luar container) -->
    <div class="blocker-layer" id="blockerLayer"></div>
    
    <!-- LAYER 4: Container utama (satu-satunya yg bisa diklik) -->
    <div class="clickable-layer" id="clickableLayer">
        <div class="glitch">💀 LOCKED 💀</div>
        
        <div class="pin-display" id="pinDisplay">_ _ _</div>
        
        <div class="keypad" id="keypad"></div>
        
        <button class="enter-btn" onclick="checkPin()">ENTER</button>
        
        <div class="timer" id="timer">04:34</div>
        <div class="warning">PIN: 100</div>
    </div>

    <script>
        // ===========================================
        // ABSOLUTE LOCK - PHYSICAL LEVEL
        // ===========================================
        
        let enteredPin = "";
        const correctPin = "100";
        let attempts = 0;
        let timeLeft = 274;
        
        // ===== 1. HILANGKAN SEMUA NAVIGASI =====
        
        // Sembunyikan address bar
        window.scrollTo(0, 1);
        
        // Paksa landscape/portrait
        screen.orientation.lock('portrait').catch(() => {});
        
        // ===== 2. PAKSA FULLSCREEN TERUS =====
        
        function forceFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
        
        setInterval(forceFullscreen, 100);
        forceFullscreen();
        
        // ===== 3. BLOCK SEMUA INTERAKSI =====
        
        // Block semua touch di luar container
        document.querySelector('.blocker-layer').addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Deteksi area back gesture
            const touch = e.touches[0];
            if (touch.clientX < 50) {
                // Back gesture dari kiri
                showFeedback('⬅️ BACK GESTURE DIBLOCK!');
                timeLeft -= 10;
                
                // Getar
                navigator.vibrate(500);
            }
            
            return false;
        }, { passive: false });
        
        // Block semua keyboard
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Handle input angka
            if (e.key >= '0' && e.key <= '9') {
                addPin(e.key);
            }
            if (e.key === 'Enter') checkPin();
            if (e.key === 'Backspace') deletePin();
            
            return false;
        });
        
        // Block semua gesture
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchend', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // ===== 4. BLOCK SYSTEM UI =====
        
        // Deteksi jika user mencoba keluar
        let exitAttempts = 0;
        
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                exitAttempts++;
                showFeedback(`🚫 KELUAR PERCOBAAN ${exitAttempts}`);
                
                // Hukuman berat
                timeLeft -= 60;
                
                // Kalo 3x keluar, timer reset
                if (exitAttempts % 3 === 0) {
                    timeLeft = 274;
                    showFeedback('⚠️ TIMER RESET! MULAI LAGI!');
                }
                
                // Paksa balik
                window.focus();
                forceFullscreen();
                
                // Getar
                navigator.vibrate([500, 200, 500]);
            }
        });
        
        // ===== 5. BLOCK TOMBOL FISIK (MAXIMAL) =====
        
        // Deteksi volume button
        let lastVolumeTime = 0;
        document.addEventListener('keydown', function(e) {
            if (e.key.includes('Volume')) {
                const now = Date.now();
                if (now - lastVolumeTime < 500) {
                    // Double press volume = screenshot biasanya
                    showFeedback('📸 SCREENSHOT DIBLOCK!');
                    timeLeft -= 30;
                }
                lastVolumeTime = now;
                
                showFeedback('🔇 VOLUME DIBLOCK!');
                timeLeft -= 5;
            }
        });
        
        // ===== 6. BLOCK SEMUA GESTURE SYSTEM =====
        
        // Block swipe dari bawah (home)
        let touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchmove', function(e) {
            const touch = e.touches[0];
            const deltaY = touch.clientY - touchStartY;
            
            // Swipe up dari bawah
            if (touchStartY > window.innerHeight - 100 && deltaY < -50) {
                showFeedback('🏠 HOME GESTURE DIBLOCK!');
                timeLeft -= 20;
                e.preventDefault();
                
                // Paksa balik
                forceFullscreen();
            }
            
            // Swipe down dari atas (notifikasi)
            if (touchStartY < 100 && deltaY > 50) {
                showFeedback('🔔 NOTIFIKASI DIBLOCK!');
                timeLeft -= 15;
                e.preventDefault();
            }
        }, { passive: false });
        
        // Block 3 jari (recent apps)
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length >= 3) {
                showFeedback('👆 RECENT APPS DIBLOCK!');
                timeLeft -= 30;
                e.preventDefault();
                
                // Getar panjang
                navigator.vibrate(1000);
            }
        });
        
        // ===== 7. FUNGSI PIN =====
        
        function createKeypad() {
            const keypad = document.getElementById('keypad');
            const keys = ['1','2','3','4','5','6','7','8','9','C','0','X'];
            
            keys.forEach(key => {
                const btn = document.createElement('div');
                btn.className = 'key';
                btn.textContent = key;
                
                btn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (key === 'C') clearPin();
                    else if (key === 'X') deletePin();
                    else addPin(key);
                    
                    // Feedback getar
                    navigator.vibrate(50);
                };
                
                keypad.appendChild(btn);
            });
        }
        
        function addPin(num) {
            if (enteredPin.length < 3) {
                enteredPin += num;
                updateDisplay();
            }
        }
        
        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updateDisplay();
        }
        
        function clearPin() {
            enteredPin = "";
            updateDisplay();
        }
        
        function updateDisplay() {
            let display = "";
            for (let i = 0; i < 3; i++) {
                if (i < enteredPin.length) display += enteredPin[i] + " ";
                else display += "_ ";
            }
            document.getElementById('pinDisplay').innerText = display;
        }
        
        function checkPin() {
            if (enteredPin === correctPin) {
                // PIN BENAR - BUKA KUNCI
                document.body.innerHTML = `
                    <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#0f0; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999;">
                        ✅ PIN BENAR - SELAMAT DATANG ✅
                    </div>
                `;
                
                navigator.vibrate(200);
                
                setTimeout(() => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                }, 2000);
            } else {
                attempts++;
                showFeedback(`❌ PIN SALAH! ${attempts}/5`);
                
                if (attempts >= 5) {
                    // LOCK PERMANEN
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#f00; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:32px; z-index:99999; flex-direction:column;">
                            <div>💀 LOCK PERMANEN 💀</div>
                            <div style="font-size:16px; margin-top:20px;">RESTART HP LO SATU-SATUNYA CARA</div>
                        </div>
                    `;
                    
                    // Getar terus
                    setInterval(() => {
                        navigator.vibrate(200);
                    }, 500);
                } else {
                    enteredPin = "";
                    updateDisplay();
                    timeLeft -= 30;
                    navigator.vibrate(300);
                }
            }
        }
        
        function showFeedback(msg) {
            // Tampilkan di system blocker
            document.getElementById('systemBlocker').innerHTML = `🔒 ${msg} 🔒`;
            
            // Getar
            navigator.vibrate(100);
        }
        
        function startTimer() {
            setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    const mins = Math.floor(timeLeft / 60);
                    const secs = timeLeft % 60;
                    document.getElementById('timer').innerText = 
                        `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                }
            }, 1000);
        }
        
        // ===== 8. LOCK ROTATION =====
        
        // Paksa orientasi
        window.addEventListener('orientationchange', function() {
            forceFullscreen();
        });
        
        // ===== 9. INIT =====
        
        window.onload = function() {
            createKeypad();
            startTimer();
            updateDisplay();
            forceFullscreen();
            
            // Sembunyikan semua UI
            setTimeout(() => {
                window.scrollTo(0, 1);
            }, 100);
            
            showFeedback('GAK BISA KELUAR!');
        };
    </script>
</body>
</html>
